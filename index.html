: setiap file .gs punya penanda versi; "Simpan & Uji" dan URL?action=ping menyebutkan file mana yang masih versi lama`,`Pesan jelas bila login/persetujuan S&K gagal karena file Apps Script belum diperbarui semua`,`Paket update kini berisi SEMUA file (tidak perlu update bertahap)`]},{version:`2.1.1`,date:`2026-10-07`,items:[`Perbaikan login PWA: aplikasi tidak lagi diam-diam masuk Mode Demo bila URL server belum diatur; muncul kotak "Hubungkan ke server"`,`Pesan kesalahan koneksi yang jelas (akses Web App bukan "Anyone", URL /dev, pembatasan domain Workspace, jaringan memblokir Google)`,`Tautan siap-pakai ?api=URL_EXEC untuk staf + tombol salin di Admin › Pengaturan; uji server lewat URL?action=ping`]},{version:`2.1.0`,date:`2026-10-06`,items:[`Info versi aplikasi & server di menu Tentang`,`Syarat & Ketentuan dan Pemberitahuan Privasi; persetujuan wajib per pengguna & tercatat di Log Audit`,`Identitas legal RS (pengendali data, kontak petugas pelindungan data) diatur Admin`,`Opsi hapus cache data pasien di perangkat saat keluar`]},{version:`2.0.1`,date:`2026-10-05`,items:[`Perbaikan: akun "admin" tidak terbuat bila data contoh dimuat sebelum Setup awal`,`Menu Buat / reset akun admin & Cek daftar pengguna`]},{version:`2.0.0`,date:`2026-10-05`,items:[`Backend Google Apps Script + Google Sheets, mode offline/PWA, lisensi, Panel Admin, 33 perbaikan bug`]}],gn=[[`Template Google AI Studio`,`Apache-2.0`],[`React, React DOM`,`MIT`],[`lucide-react (ikon)`,`ISC`],[`Motion`,`MIT`],[`Tailwind CSS`,`MIT`],[`Plus Jakarta Sans, JetBrains Mono`,`SIL OFL 1.1`]];function _n(e,t){let n=e||{};return{controllerName:n.legalEntity||n.controllerName||t||`[Nama Rumah Sakit / Klinik]`,address:n.hospitalAddress||n.address||`[alamat belum diisi Admin]`,dpoContact:n.dpoContact||`[kontak Petugas Pelindungan Data belum diisi Admin]`,providerName:n.providerName||`[nama penyedia aplikasi]`,providerContact:n.providerContact||``,retentionYears:Math.max(25,Number(n.retentionYears||25)),clearCacheOnLogout:n.clearCacheOnLogout!==!1,waEnabled:!!n.waEnabled}}function vn(e){return[{h:`1. Para pihak & ruang lingkup`,p:[`Aplikasi ${dn} ("Aplikasi") dioperasikan oleh ${e.controllerName} ("Rumah Sakit") untuk keperluan pelayanan kesehatan dan administrasi internal. Aplikasi disediakan oleh ${e.providerName} ("Penyedia") berdasarkan perjanjian lisensi dengan Rumah Sakit.`,`Ketentuan ini berlaku bagi setiap staf, tenaga kesehatan, dan pihak lain yang diberi akun oleh Admin SIMRS ("Pengguna"). Dengan menekan "Saya Setuju", Pengguna menyatakan telah membaca, memahami, dan terikat pada Ketentuan ini serta Pemberitahuan Privasi.`]},{h:`2. Akun & keamanan`,li:[`Akun bersifat pribadi. Dilarang meminjamkan akun, membagikan password, atau login dengan akun orang lain.`,`Gunakan password minimal 8 karakter yang tidak dipakai di layanan lain. Segera ganti password dan lapor ke Admin SIMRS bila diduga bocor.`,`Keluar (logout) setelah selesai, terutama di komputer bersama. Aplikasi juga keluar otomatis bila tidak ada aktivitas.`,`Akun terkunci sementara setelah beberapa kali salah password; hubungi Admin SIMRS untuk bantuan.`]},{h:`3. Penggunaan yang diizinkan`,li:[`Aplikasi hanya boleh digunakan untuk pelayanan pasien dan tugas administrasi sesuai jabatan Pengguna.`,`Akses rekam medis hanya bila diperlukan untuk tugas Anda terhadap pasien tersebut (prinsip "perlu-tahu"). Membuka rekam medis karena ingin tahu, termasuk milik keluarga, kenalan, atau tokoh publik, merupakan pelanggaran.`,`Dilarang memotret layar, menyalin, mengekspor, atau mengirim data pasien ke luar sistem (misalnya grup percakapan, email pribadi, media sosial) kecuali sesuai prosedur resmi Rumah Sakit.`,`Dilarang mencoba melewati pembatasan hak akses, mengubah kode atau pemeriksaan lisensi, atau mengganggu kinerja sistem.`,`Data yang dimasukkan harus benar, lengkap, dan dapat dipertanggungjawabkan. Kesalahan diperbaiki melalui Aplikasi agar tercatat di Log Audit, bukan dengan mengubah spreadsheet secara langsung.`]},{h:`4. Kerahasiaan rekam medis`,p:[`Rekam medis dan data kesehatan pasien bersifat rahasia menurut peraturan perundang-undangan di bidang kesehatan dan pelindungan data pribadi, termasuk Undang-Undang tentang Kesehatan, Peraturan Menteri Kesehatan No. 24 Tahun 2022 tentang Rekam Medis, dan Undang-Undang No. 27 Tahun 2022 tentang Pelindungan Data Pribadi. Kewajiban menjaga kerahasiaan tetap berlaku setelah Pengguna tidak lagi bekerja di Rumah Sakit.`,`Pelanggaran dapat dikenai sanksi disiplin sesuai peraturan internal Rumah Sakit dan sanksi hukum sesuai peraturan perundang-undangan.`]},{h:`5. Tanggung jawab klinis`,li:[`Aplikasi adalah alat bantu administrasi dan dokumentasi, bukan perangkat medis, dan tidak menggantikan penilaian klinis tenaga kesehatan.`,`Saran sistem (antara lain urutan batch FEFO, kategori triase, KPI) wajib diverifikasi Pengguna sebelum ditindaklanjuti.`,`Data yang dibuat saat offline (ditandai nomor sementara "*") baru final setelah tersinkron ke server.`]},{h:`6. Pencatatan & pemantauan`,p:[`Untuk keamanan dan akuntabilitas, Aplikasi mencatat aktivitas Pengguna ke Log Audit, antara lain login berhasil dan gagal, pembuatan, perubahan, dan penghapusan data, persetujuan dokumen ini, serta tindakan administratif. Log Audit dapat diperiksa oleh Admin SIMRS dan pihak berwenang Rumah Sakit.`]},{h:`7. Ketersediaan layanan & batasan`,li:[`Aplikasi berjalan di atas layanan Google (Apps Script, Sheets, Drive) dan, bila dipakai, GitHub Pages. Ketersediaan bergantung pada layanan tersebut dan koneksi internet.`,`Rumah Sakit wajib memiliki prosedur cadangan (misalnya formulir kertas) untuk gangguan sistem.`,`Aplikasi belum terintegrasi resmi dengan SATUSEHAT maupun BPJS Kesehatan dan tidak boleh dinyatakan sebagai sistem tersertifikasi, kecuali disepakati dalam perjanjian proyek terpisah.`]},{h:`8. Hak kekayaan intelektual`,p:[`Hak cipta Aplikasi dimiliki Penyedia. Komponen sumber terbuka tunduk pada lisensinya masing-masing (lihat menu Tentang). Seluruh data yang dimasukkan merupakan milik dan tanggung jawab ${e.controllerName}.`]},{h:`9. Penangguhan & penghentian akses`,p:[`Admin SIMRS dapat menonaktifkan akun yang tidak lagi diperlukan atau diduga melanggar Ketentuan ini. Bila lisensi Rumah Sakit berakhir, Aplikasi beralih ke mode baca-saja tanpa menghapus data.`]},{h:`10. Perubahan ketentuan`,p:[`Ketentuan ini dapat diperbarui. Versi baru ditandai dengan tanggal versi dan wajib disetujui ulang saat Pengguna login berikutnya. Pengguna yang tidak menyetujui tidak dapat mengubah data di Aplikasi.`]},{h:`11. Hukum yang berlaku & kontak`,p:[`Ketentuan ini tunduk pada hukum Republik Indonesia. Pertanyaan mengenai penggunaan Aplikasi dapat diajukan kepada Admin SIMRS ${e.controllerName}${e.address?`, `+e.address:``}.`]}]}function yn(e){return[{h:`1. Siapa yang memproses data`,li:[`Pengendali Data Pribadi: ${e.controllerName}${e.address?`, `+e.address:``}.`,`Petugas/pejabat pelindungan data pribadi: ${e.dpoContact}.`,`Penyedia aplikasi: ${e.providerName}${e.providerContact?` (`+e.providerContact+`)`:``}. Penyedia hanya mengakses data bila diminta Rumah Sakit untuk dukungan teknis, sebagai Prosesor Data Pribadi atas instruksi Rumah Sakit.`]},{h:`2. Data yang diproses`,p:[`Data pasien, yang termasuk data pribadi yang bersifat spesifik:`],li:[`Identitas: nama, NIK, tanggal lahir, umur, jenis kelamin, alamat, nomor telepon/WhatsApp, nomor rekam medis.`,`Penjaminan: jenis penjamin, nomor kartu BPJS/asuransi, nomor SEP.`,`Data kesehatan: keluhan, tanda vital, triase, catatan SOAP, diagnosis (ICD-10), alergi, riwayat penyakit, obat yang diberikan, permintaan dan hasil laboratorium/radiologi, data rawat inap.`,`Administrasi & keuangan: kunjungan, antrean, tagihan, dan klaim.`]},{h:``,p:[`Data staf pengguna:`],li:[`Nama, gelar, jabatan, unit, NIP/SIP/STR, username, peran, nomor telepon/email (bila diisi), dan foto profil (bila diunggah).`,`Data keamanan: hash password (password asli tidak disimpan), waktu login, percobaan login gagal, perangkat/peramban saat login, dan seluruh aktivitas di Log Audit.`,`Waktu dan versi persetujuan Syarat & Ketentuan serta Pemberitahuan Privasi.`]},{h:`3. Tujuan & dasar pemrosesan`,li:[`Pelayanan kesehatan, pencatatan rekam medis, farmasi, rawat inap, dan rujukan, sebagai pemenuhan kewajiban hukum Rumah Sakit dan pelaksanaan perjanjian pelayanan dengan pasien. Dalam keadaan darurat, pemrosesan juga dilakukan untuk melindungi kepentingan vital pasien.`,`Penagihan dan klaim penjaminan, untuk pelaksanaan perjanjian dan kewajiban hukum.`,`Keamanan sistem, Log Audit, dan pencegahan penyalahgunaan, sebagai kepentingan yang sah Rumah Sakit serta kewajiban menjaga keamanan rekam medis.`,`Manajemen staf dan hak akses, untuk pelaksanaan hubungan kerja.`,e.waEnabled?`Notifikasi WhatsApp kepada pasien (nomor antrean dan pemanggilan), dengan persetujuan pasien. Pasien dapat meminta penghentian notifikasi di loket pendaftaran.`:`Notifikasi WhatsApp kepada pasien saat ini tidak diaktifkan. Bila diaktifkan, notifikasi hanya dikirim dengan persetujuan pasien.`]},{h:`4. Di mana data disimpan & siapa penerimanya`,li:[`Google Sheets dan Google Drive milik akun Google ${e.controllerName} menyimpan data utama, backup harian (14 salinan terakhir), dan foto profil/logo. Google bertindak sebagai penyedia infrastruktur awan, dan pusat datanya dapat berada di luar wilayah Indonesia. Rumah Sakit bertanggung jawab memastikan transfer tersebut memenuhi ketentuan transfer data pribadi lintas negara dalam UU PDP, antara lain melalui perjanjian layanan Google Workspace.`,`Fonnte (gateway WhatsApp) menerima nomor telepon dan isi pesan antrean hanya bila notifikasi WhatsApp diaktifkan.`,`Email ringkasan peringatan harian ke Admin berisi data stok, aset, dan jadwal, tanpa data klinis pasien.`,`GitHub Pages hanya menyajikan tampilan aplikasi. Data pasien tidak pernah dikirim ke GitHub.`,`Data tidak dijual dan tidak dipakai untuk iklan. Aplikasi tidak memakai pelacak analitik pihak ketiga.`,`Pengungkapan kepada pihak lain (misalnya BPJS, asuransi, atau aparat penegak hukum) hanya dilakukan sesuai peraturan perundang-undangan atau persetujuan pasien.`]},{h:`5. Data di perangkat Anda`,li:[`Untuk mode offline, Aplikasi menyimpan salinan data yang boleh Anda akses dan antrean perubahan yang belum terkirim di penyimpanan peramban (IndexedDB) perangkat ini.`,`Untuk login offline, Aplikasi menyimpan hash password yang diberi salt, berlaku paling lama 14 hari. Password asli tidak disimpan.`,e.clearCacheOnLogout?`Saat Anda keluar, salinan data pasien di perangkat dihapus otomatis, kecuali masih ada perubahan yang belum tersinkron. Perubahan tersebut dikirim dan dihapus saat online.`:`Pengaturan Rumah Sakit saat ini MENYIMPAN salinan data di perangkat setelah keluar agar dapat dipakai offline. Gunakan hanya perangkat milik Rumah Sakit yang terkunci dengan PIN/password.`,`Penyimpanan lokal lainnya: token sesi, pilihan tema, dan URL server. Tidak ada cookie iklan.`]},{h:`6. Masa penyimpanan`,li:[`Rekam medis disimpan paling singkat ${e.retentionYears} tahun sejak kunjungan terakhir pasien, sesuai ketentuan rekam medis yang berlaku, kemudian dimusnahkan atau diarsipkan sesuai prosedur Rumah Sakit.`,`Data akun staf disimpan selama masa kerja, dan setelahnya akun dinonaktifkan (bukan dihapus) agar jejak audit tetap utuh.`,`Log Audit disimpan selama diperlukan untuk akuntabilitas rekam medis. Backup otomatis disimpan bergulir (14 salinan terakhir).`]},{h:`7. Keamanan`,li:[`Pembatasan hak akses per peran yang diperiksa di server, login dengan password ber-hash, penguncian setelah percobaan gagal, sesi bertoken yang kedaluwarsa, dan keluar otomatis saat tidak aktif.`,`Log Audit untuk setiap perubahan, backup harian, dan perlindungan dari injeksi rumus pada spreadsheet.`,`Rumah Sakit wajib membatasi pembagian spreadsheet hanya kepada pengelola TI dan mengaktifkan verifikasi 2 langkah pada akun Google pemilik.`,`Bila terjadi kegagalan pelindungan data, Rumah Sakit akan memberitahukan subjek data dan lembaga yang berwenang paling lambat 3×24 jam sesuai UU PDP.`]},{h:`8. Hak subjek data`,p:[`Sesuai UU PDP, pasien dan staf berhak antara lain untuk: memperoleh informasi pemrosesan; mengakses dan memperoleh salinan data; memperbaiki data yang tidak akurat; meminta penghentian pemrosesan atau penghapusan data sepanjang tidak bertentangan dengan kewajiban penyimpanan rekam medis; menarik persetujuan untuk pemrosesan berbasis persetujuan (misalnya notifikasi WhatsApp); serta mengajukan keberatan atau pengaduan.`,`Ajukan permintaan kepada ${e.dpoContact}. Pasien juga dapat mengajukannya melalui unit rekam medis atau loket pendaftaran. Identitas pemohon akan diverifikasi terlebih dahulu.`]},{h:`9. Perubahan pemberitahuan`,p:[`Pemberitahuan ini dapat diperbarui mengikuti perubahan fitur atau peraturan. Versi berlaku ditandai dengan tanggal versi di bawah. Perubahan material wajib disetujui ulang oleh Pengguna.`]}]}function bn(e,t){let n=[e,`Versi ${mn} • ${dn} v${fn}`,``];return t.forEach(e=>{e.h&&n.push(e.h),(e.p||[]).forEach(e=>n.push(e)),(e.li||[]).forEach(e=>n.push(`• `+e)),n.push(``)}),n.join(`
